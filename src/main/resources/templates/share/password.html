<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>需要密码 - TopLinks</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/style/common.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg fade-in">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <i class="bi bi-lock-fill" style="font-size: 3rem;"></i>
                        <h4 class="mt-2 mb-0">需要访问密码</h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <div class="file-icon bg-light d-inline-flex mb-3" 
                                 style="width: 80px; height: 80px; border-radius: 16px;">
                                <i class="bi bi-file-earmark-lock display-1 text-primary m-auto"></i>
                            </div>
                            <h5 class="mb-2" th:text="${file.name}">文件名</h5>
                            <div class="d-flex justify-content-center gap-3 text-muted">
                                <span>
                                    <i class="bi bi-hdd me-1"></i>
                                    <span th:text="${file.sizeText}">-</span>
                                </span>
                                <span th:if="${share.maxDownloads}">
                                    <i class="bi bi-download me-1"></i>
                                    剩余 <span th:text="${share.maxDownloads - share.downloadCount}">-</span> 次
                                </span>
                            </div>
                        </div>

                        <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${error == 'invalid_password' ? '密码错误，请重试' : '访问被拒绝'}"></span>
                        </div>

                        <form th:action="@{/share/{token}(token=${share.shareToken})}" method="get">
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-key me-1"></i> 密码
                                </label>
                                <div class="password-input-group">
                                    <input type="password" 
                                           class="form-control form-control-lg" 
                                           id="password" 
                                           name="password" 
                                           placeholder="请输入访问密码"
                                           required 
                                           autofocus>
                                    <i class="bi bi-eye toggle-password" 
                                       onclick="togglePassword('password')"></i>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-unlock me-2"></i>继续
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">
                                <small>
                                    <i class="bi bi-shield-check me-1"></i>
                                    此分享受密码保护，安全传输
                                </small>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a th:href="@{/}" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i>返回首页
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.target;
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
