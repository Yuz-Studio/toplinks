<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      lang="en">
<head th:replace="~{template :: head(${pageTitle ?: 'Home'})}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{template :: navbar}"></nav>

<main class="container py-4 flex-grow-1">

    <!-- Flash messages -->
    <div th:if="${message}" th:class="'alert ' + ${alertClass} + ' alert-dismissible fade show'" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Upload prompt for non-logged-in users -->
    <div sec:authorize="!isAuthenticated()" class="mb-4">
        <div class="alert alert-info d-flex align-items-center" role="alert">
            <i class="bi bi-info-circle-fill me-2 fs-5"></i>
            <div class="flex-grow-1">
                <strong>Want to upload files?</strong> 
                <span class="ms-2">Please log in or register to start uploading.</span>
            </div>
            <a th:href="@{/auth/login}" class="btn btn-sm btn-primary ms-2">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
            <a th:href="@{/auth/register}" class="btn btn-sm btn-outline-primary ms-2">
                <i class="bi bi-person-plus"></i> Register
            </a>
        </div>
    </div>

    <!-- Category filter bar (always visible) -->
    <div th:if="${categories != null and not #lists.isEmpty(categories)}" class="mb-4">
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <a th:href="@{/}" th:classappend="${selectedCategory == null ? ' active' : ''}"
               class="btn btn-sm btn-outline-primary">
                <i class="bi bi-grid"></i> All
            </a>
            <a th:each="cat : ${categories}"
               th:href="@{/category/{id}(id=${cat.id})}"
               th:classappend="${selectedCategory == cat.id ? ' active' : ''}"
               class="btn btn-sm btn-outline-secondary">
                <i th:class="${'bi ' + (cat.icon ?: 'bi-folder')}"></i>
                <span th:text="${cat.name}"></span>
            </a>
        </div>
    </div>

    <!-- ============================================================
         DEFAULT HOME VIEW: multi-category sections with limited files
         ============================================================ -->
    <div th:if="${categorySections != null}">

        <!-- No categories at all: show recent files or empty state -->
        <div th:if="${#lists.isEmpty(categorySections)}">
            <div th:if="${recentFiles == null or #lists.isEmpty(recentFiles)}" class="text-center text-muted py-5">
                <i class="bi bi-inbox display-4"></i>
                <p class="mt-2">No files yet</p>
                <a sec:authorize="isAuthenticated()" th:href="@{/upload}" class="btn btn-primary mt-2">
                    <i class="bi bi-cloud-upload"></i> Upload the first file
                </a>
                <a sec:authorize="!isAuthenticated()" th:href="@{/auth/login}" class="btn btn-primary mt-2">
                    Log in to upload
                </a>
            </div>
            <div th:unless="${recentFiles == null or #lists.isEmpty(recentFiles)}">
                <div class="tlk-section-header d-flex align-items-center justify-content-between mb-3">
                    <h5 class="fw-bold mb-0"><i class="bi bi-clock-history me-2"></i>Recent Files</h5>
                </div>
                <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3">
                    <div th:each="file : ${recentFiles}" class="col">
                        <div class="card h-100 shadow-sm file-card">
                            <div th:if="${file.fileType == 'image'}" class="card-img-top tlk-preview bg-body-tertiary">
                                <img th:src="${file.cloudUrl}" th:alt="${file.name}" class="h-100 w-100" style="object-fit:cover;">
                            </div>
                            <div th:unless="${file.fileType == 'image'}" class="card-img-top d-flex align-items-center justify-content-center tlk-preview bg-body-tertiary">
                                <i th:class="${'bi tlk-file-icon ' + file.iconClass}"></i>
                            </div>
                            <div class="card-body p-2">
                                <p class="card-text text-truncate small fw-semibold mb-1" th:text="${file.name}" th:title="${file.name}"></p>
                                <p class="card-text text-muted" style="font-size:0.7rem;">
                                    <span th:text="${file.sizeText}"></span>
                                </p>
                            </div>
                            <div class="card-footer p-2 d-flex gap-1">
                                <a th:href="@{/file/{uid}(uid=${file.uid})}" class="btn btn-sm btn-outline-primary flex-grow-1">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/file/{uid}/download(uid=${file.uid})}" class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-download"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Category sections -->
        <div th:unless="${#lists.isEmpty(categorySections)}">
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div th:each="section, iterStat : ${categorySections}" class="col">
                    <div class="card h-100 shadow-sm">
                        <!-- Section header -->
                        <div class="card-header d-flex align-items-center justify-content-between bg-body-tertiary">
                            <h6 class="fw-bold mb-0 text-truncate" th:title="${section.category.name}">
                                <i th:class="${'bi me-2 ' + (section.category.icon ?: 'bi-folder')}"></i>
                                <span th:text="${section.category.name}"></span>
                            </h6>
                            <a th:href="@{/category/{id}(id=${section.category.id})}"
                               class="text-decoration-none small text-secondary">
                                More <i class="bi bi-chevron-right" style="font-size: 0.75rem;"></i>
                            </a>
                        </div>
                        <!-- Category content -->
                        <div class="list-group list-group-flush">
                            <div th:each="file, iterStat : ${section.files}" th:if="${iterStat.index < 10}" 
                                 class="list-group-item d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center text-truncate me-2">
                                    <i th:class="${'bi me-2 ' + (file.iconClass ?: 'bi-file-earmark')}"></i>
                                    <a th:href="@{/file/{uid}(uid=${file.uid})}" 
                                       class="text-decoration-none text-body text-truncate" 
                                       th:text="${file.name}" th:title="${file.name}"></a>
                                </div>
                                <a th:href="@{/file/{uid}/download(uid=${file.uid})}" 
                                   class="text-secondary" title="Download">
                                    <i class="bi bi-download"></i>
                                </a>
                            </div>
                            <div th:if="${#lists.isEmpty(section.files)}" class="list-group-item text-center text-muted small py-3">
                                No files available
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         CATEGORY-FILTERED VIEW: paginated file list
         ============================================================ -->
    <div th:if="${files != null}">
        <div th:if="${#lists.isEmpty(files)}" class="text-center text-muted py-5">
            <i class="bi bi-inbox display-4"></i>
            <p class="mt-2">No files in this category</p>
            <a sec:authorize="isAuthenticated()" th:href="@{/upload}" class="btn btn-primary mt-2">
                <i class="bi bi-cloud-upload"></i> Upload a file
            </a>
        </div>

        <div th:unless="${#lists.isEmpty(files)}"
             class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3">
            <div th:each="file : ${files}" class="col">
                <div class="card h-100 shadow-sm file-card">
                    <div th:if="${file.fileType == 'image'}" class="card-img-top tlk-preview bg-body-tertiary">
                        <img th:src="${file.cloudUrl}" th:alt="${file.name}" class="h-100 w-100" style="object-fit:cover;">
                    </div>
                    <div th:unless="${file.fileType == 'image'}" class="card-img-top d-flex align-items-center justify-content-center tlk-preview bg-body-tertiary">
                        <i th:class="${'bi tlk-file-icon ' + file.iconClass}"></i>
                    </div>
                    <div class="card-body p-2">
                        <p class="card-text text-truncate small fw-semibold mb-1" th:text="${file.name}" th:title="${file.name}"></p>
                        <p class="card-text text-muted" style="font-size:0.7rem;">
                            <span th:text="${file.sizeText}"></span>
                        </p>
                    </div>
                    <div class="card-footer p-2 d-flex gap-1">
                        <a th:href="@{/file/{uid}(uid=${file.uid})}" class="btn btn-sm btn-outline-primary flex-grow-1">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/file/{uid}/download(uid=${file.uid})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-download"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${totalPages > 1}" class="mt-4 d-flex justify-content-center" aria-label="File list pagination">
            <ul class="pagination">
                <li th:classappend="${currentPage <= 1 ? ' disabled' : ''}" class="page-item">
                    <a class="page-link"
                       th:href="${selectedCategory != null}
                           ? @{/category/{id}(id=${selectedCategory}, page=${currentPage - 1})}
                           : @{/(page=${currentPage - 1})}"
                       aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage ? ' active' : ''}" class="page-item">
                    <a class="page-link"
                       th:href="${selectedCategory != null}
                           ? @{/category/{id}(id=${selectedCategory}, page=${i})}
                           : @{/(page=${i})}"
                       th:text="${i}"></a>
                </li>
                <li th:classappend="${currentPage >= totalPages ? ' disabled' : ''}" class="page-item">
                    <a class="page-link"
                       th:href="${selectedCategory != null}
                           ? @{/category/{id}(id=${selectedCategory}, page=${currentPage + 1})}
                           : @{/(page=${currentPage + 1})}"
                       aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

</main>

<footer th:replace="~{template :: footer}"></footer>
<div th:replace="~{template :: scripts}"></div>
</body>
</html>
