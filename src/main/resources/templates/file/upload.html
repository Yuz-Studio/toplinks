<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{template :: head('Upload File')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{template :: navbar}"></nav>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div th:if="${message}" th:class="'alert ' + ${alertClass} + ' alert-dismissible fade show'" role="alert">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title mb-4">
                        <i class="bi bi-cloud-upload"></i> Upload File
                    </h4>

                    <form th:action="@{/upload}" method="post" enctype="multipart/form-data" id="uploadForm">
                        <div class="mb-4">
                            <label for="file" class="form-label">Select Files <span class="text-danger">*</span></label>
                            <input type="file" id="file" name="file" class="form-control" required multiple>
                            <div class="form-text">
                                Supports PDF, images, audio, video, documents and more. Max 50 MB per file. Can select multiple files.
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="encryptToggle">
                                <label class="form-check-label" for="encryptToggle">
                                    <i class="bi bi-shield-lock"></i> Encrypt file
                                </label>
                            </div>
                            <div class="form-text">
                                Encrypt the file before uploading for extra security. You'll need the password to download.
                            </div>
                        </div>

                        <div class="mb-4" id="passwordGroup" style="display: none;">
                            <label for="password" class="form-label">Encryption Password</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password to encrypt">
                            <div class="form-text">
                                This password will be required to download the file. Keep it safe!
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="categoryId" class="form-label">Category (Optional)</label>
                            <select id="categoryId" name="categoryId" class="form-select">
                                <option value="">-- Select Category --</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="uploadBtn">
                            <i class="bi bi-cloud-upload"></i> Upload
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{template :: footer}"></footer>
<div th:replace="~{template :: scripts}"></div>
<script>
// Load categories
fetch('/api/categories')
    .then(r => r.json())
    .then(data => {
        if (data.success && data.data) {
            var select = document.getElementById('categoryId');
            data.data.forEach(cat => {
                var opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = (cat.icon ? '📁 ' : '') + cat.name;
                select.appendChild(opt);
            });
        }
    })
    .catch(e => console.log('Failed to load categories', e));

// Encryption toggle
var encryptToggle = document.getElementById('encryptToggle');
var passwordGroup = document.getElementById('passwordGroup');
var passwordInput = document.getElementById('password');

if (encryptToggle) {
    encryptToggle.addEventListener('change', function() {
        if (this.checked) {
            passwordGroup.style.display = 'block';
            passwordInput.required = true;
        } else {
            passwordGroup.style.display = 'none';
            passwordInput.required = false;
            passwordInput.value = '';
        }
    });
}

document.getElementById('uploadForm').addEventListener('submit', function (e) {
    var fileInput = document.getElementById('file');
    var maxTotal = 50 * 1024 * 1024; // 50 MB
    var totalSize = 0;
    for (var i = 0; i < fileInput.files.length; i++) {
        totalSize += fileInput.files[i].size;
    }
    if (totalSize > maxTotal) {
        e.preventDefault();
        var totalMB = (totalSize / 1024 / 1024).toFixed(1);
        alert('Total file size ' + totalMB + ' MB exceeds the 50 MB limit');
        return;
    }
    
    // Add encrypt flag to form
    if (encryptToggle && encryptToggle.checked) {
        var encryptInput = document.createElement('input');
        encryptInput.type = 'hidden';
        encryptInput.name = 'encrypt';
        encryptInput.value = 'true';
        this.appendChild(encryptInput);
    }
    
    var btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    var count = fileInput.files.length;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> Uploading ' + count + ' file' + (count > 1 ? 's' : '') + '...';
});
</script>
</body>
</html>
